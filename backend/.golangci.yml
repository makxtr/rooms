version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - noctx
    - sloglint
    - unconvert
  settings:
    forbidigo:
      # Types are resolved, so an import alias cannot hide a call.
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: domain and use-case code take `now` as a parameter; the clock is read at the edge (platform/clock)
        # With analyze-types the name is matched fully qualified (import path included).
        - pattern: ^(github\.com/google/)?uuid\.New.*$
          msg: domain and use-case code receive identifiers; they are generated behind the IDGenerator port
    sloglint:
      # request_id is attached from the context, so a log call that has a
      # context in scope must pass it.
      context: scope
    depguard:
      rules:
        # domain/: standard library and the shared kernel, nothing else.
        domain-purity:
          list-mode: strict
          files:
            - "**/internal/*/domain/**"
          allow:
            - $gostd
            - github.com/makxtr/rooms/backend/internal/shared/ids
            # The repo's convention is external test packages
            # (`package domain_test` importing `.../internal/<ctx>/domain`),
            # so each context's own domain package must be allowed for its
            # own tests to import it.
            - github.com/makxtr/rooms/backend/internal/identity/domain
            - github.com/makxtr/rooms/backend/internal/rooms/domain
            - github.com/makxtr/rooms/backend/internal/conversation/domain
        # app/: use cases know ports, not transports or storage.
        app-layer:
          list-mode: lax
          files:
            - "**/internal/*/app/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/apigen
              desc: transport types stay in adapters/http
            - pkg: github.com/makxtr/rooms/backend/internal/realtime
              desc: publish through the context's own EventPublisher port
            - pkg: github.com/makxtr/rooms/backend/internal/bootstrap
              desc: wiring depends on contexts, not the other way round
            - pkg: github.com/jackc/pgx
              desc: storage stays in adapters/postgres
            - pkg: net/http
              desc: transport stays in adapters/http
        # app/: use cases depend on ports, never on their own adapters.
        # _test.go is excluded because use-case tests wire in-memory adapters.
        app-inward:
          list-mode: lax
          files:
            - "**/internal/*/app/**"
            - "!**/*_test.go"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/identity/adapters
              desc: use cases depend on ports, never on their own adapters
            - pkg: github.com/makxtr/rooms/backend/internal/rooms/adapters
              desc: use cases depend on ports, never on their own adapters
            - pkg: github.com/makxtr/rooms/backend/internal/conversation/adapters
              desc: use cases depend on ports, never on their own adapters
        identity-isolation:
          list-mode: lax
          files:
            - "**/internal/identity/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/rooms
              desc: bounded contexts talk through ports, not imports
            - pkg: github.com/makxtr/rooms/backend/internal/conversation
              desc: bounded contexts talk through ports, not imports
        rooms-isolation:
          list-mode: lax
          files:
            - "**/internal/rooms/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/identity
              desc: bounded contexts talk through ports, not imports
            - pkg: github.com/makxtr/rooms/backend/internal/conversation
              desc: bounded contexts talk through ports, not imports
        conversation-isolation:
          list-mode: lax
          files:
            - "**/internal/conversation/**"
            - "!**/internal/conversation/adapters/roomaccess/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/identity
              desc: bounded contexts talk through ports, not imports
            - pkg: github.com/makxtr/rooms/backend/internal/rooms
              desc: only adapters/roomaccess may call into rooms
        # The one sanctioned bridge: it may call rooms use cases, nothing deeper.
        conversation-roomaccess-bridge:
          list-mode: lax
          files:
            - "**/internal/conversation/adapters/roomaccess/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/rooms/domain
              desc: the bridge calls rooms/app only
            - pkg: github.com/makxtr/rooms/backend/internal/rooms/adapters
              desc: the bridge calls rooms/app only
            - pkg: github.com/makxtr/rooms/backend/internal/identity
              desc: bounded contexts talk through ports, not imports
        # The hub is generic: it delivers envelopes and knows no domain.
        realtime-isolation:
          list-mode: lax
          files:
            - "**/internal/realtime/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/identity
              desc: the hub is domain-agnostic
            - pkg: github.com/makxtr/rooms/backend/internal/rooms
              desc: the hub is domain-agnostic
            - pkg: github.com/makxtr/rooms/backend/internal/conversation
              desc: the hub is domain-agnostic
        # shared/ and platform/ are leaves: they never look up at contexts.
        foundation-isolation:
          list-mode: lax
          files:
            - "**/internal/shared/**"
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/makxtr/rooms/backend/internal/identity
              desc: foundation packages do not depend on contexts
            - pkg: github.com/makxtr/rooms/backend/internal/rooms
              desc: foundation packages do not depend on contexts
            - pkg: github.com/makxtr/rooms/backend/internal/conversation
              desc: foundation packages do not depend on contexts
            - pkg: github.com/makxtr/rooms/backend/internal/realtime
              desc: foundation packages do not depend on contexts
            - pkg: github.com/makxtr/rooms/backend/internal/bootstrap
              desc: foundation packages do not depend on wiring
  exclusions:
    rules:
      # forbidigo guards only domain/ and app/ of the bounded contexts…
      - linters: [forbidigo]
        path-except: internal/[^/]+/(domain|app)/
      # …and not their tests, which build fixtures freely.
      - linters: [forbidigo]
        path: _test\.go$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/makxtr/rooms/backend
