# Development services. The backend itself runs on the host (`make dev`).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rooms
      POSTGRES_PASSWORD: rooms # local development only
      POSTGRES_DB: rooms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rooms -d rooms"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
